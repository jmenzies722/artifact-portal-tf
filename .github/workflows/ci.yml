# Pull requests: test everything and show the Terraform plan. Read-only in AWS.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write # lets the job ask GitHub for an OIDC token

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.15.3

jobs:
  lambda-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r lambda/requirements-dev.txt
      - run: python -m pytest -q

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  terraform-plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
        working-directory: .
      # Short-lived credentials for the read-only plan role. No stored keys.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::755484097925:role/artifact-portal-gha-plan
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -input=false
      - run: terraform validate
      - name: terraform plan
        run: |
          terraform plan -input=false -no-color -lock-timeout=60s | tee plan.txt
          {
            echo "### Terraform plan (dev)"
            echo '```'
            grep -E '^\s+# |^Plan:|^No changes' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
